name: Build, Push Docker Image and Update GitOps

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }} # us-east-1
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }} # e.g., 753675398055.dkr.ecr.us-east-1.amazonaws.com/wordpress-app
  GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
  GITOPS_BRANCH: ${{ secrets.GITOPS_BRANCH }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.prepare_image.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare image tag
        id: prepare_image
        run: |
          IMAGE_TAG="r${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "::set-output name=image_tag::$IMAGE_TAG"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest

  update-gitops-repo:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: AmirBasiony/K8s-GitOps-wordpress
          token: ${{ secrets.PAT_GITOPS }}
          path: gitops-repo

      - name: Update image tag in kustomization overlay
        run: |
          cd gitops-repo/overlays/prod
          FILE="kustomization.yaml"
          TAG="${{ needs.build-and-push.outputs.image_tag }}"

          # Replace newTag if it exists, otherwise append it under the first image
          if grep -q "newTag:" "$FILE"; then
            sed -i "0,/newTag:/s|newTag:.*|newTag: \"$TAG\"|" "$FILE"
          else
            sed -i "/images:/,/newName:/s|\$|\n    newTag: \"$TAG\"|" "$FILE"
          fi

      - name: Commit and push GitOps changes
        run: |
          cd gitops-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add overlays/prod/kustomization.yaml
          git commit -m "Update WordPress app image to ${{ needs.build-and-push.outputs.image_tag }}" || echo "No changes to commit"
          git push
